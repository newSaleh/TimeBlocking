<title>Pocket Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A private, end-to-end encrypted pocket notebook for time blocking.">
<style>
/*STYLES*/
</style>
<div id="app" class="app" data-view="day">
  <header class="top">
    <div class="top-row">
      <button id="dayTitle" class="day-title" type="button">
        <span id="dayMain" class="day-main"></span>
        <span id="daySub" class="day-sub tnum"></span>
      </button>
      <div class="top-actions">
        <button id="todayBtn" class="pill" type="button" hidden></button>
        <button id="prevBtn" class="icon-btn" type="button">
          <svg class="icon flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button id="nextBtn" class="icon-btn" type="button">
          <svg class="icon flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button id="printBtn" class="icon-btn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></svg>
        </button>
        <a id="viewLink" class="icon-btn" href="../">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
        </a>
        <button id="settingsBtn" class="icon-btn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        </button>
      </div>
    </div>
    <nav class="week" id="week">
      <div id="weekDays" class="week-days"></div>
    </nav>
    <p id="status" class="status" role="status" aria-live="polite" hidden></p>
  </header>
  <main id="main" class="main grid-main"><div id="list"></div></main>
  <div id="timer" class="timer"></div>
  <footer class="composer">
    <div id="parse" class="parse" hidden>
      <span id="parseChip" class="parse-chip tnum"></span>
      <button id="parseIgnore" class="parse-x" type="button"></button>
    </div>
    <form id="composer" class="composer-form" autocomplete="off">
      <input id="newTask" class="composer-input" type="text" maxlength="300" autocomplete="off" autocapitalize="sentences" spellcheck="true" dir="auto">
      <button id="addBtn" class="send" type="submit" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </form>
  </footer>
</div>
<div id="sheetLayer" class="sheet-layer" hidden>
  <div id="backdrop" class="backdrop"></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true"></section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="gate" class="gate" hidden></div>
<script>
/*SCRIPT*/
</script>
