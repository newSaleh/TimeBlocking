<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#16191e" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pocket Time"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="icon" href="../icon-192.png"></head><body><title>Pocket Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A private, end-to-end encrypted pocket notebook for time blocking.">
<style>
/* Layout: one calm column. A day header, the day as a pocket-diary page
   with a time margin, and the composer resting in the thumb zone. */
:root {
  --bg: #f4f5f7;
  --page: #ffffff;
  --fg: #15181d;
  --muted: #646b7a;
  --faint: #9aa0ac;
  --line: #e3e6eb;
  --accent: #2a57c0;
  --accent-fg: #ffffff;
  --accent-soft: #e7edfa;
  --tag-bg: #f2ecdc;
  --tag-fg: #6d5a1e;
  --scrim: rgba(18, 22, 30, 0.32);
  --surface: #f2f4f7;
  --sheet: #ffffff;
  --sel-bg: #15181d;
  --sel-fg: #ffffff;
  --danger: #c2372d;
  --ink: #1d2f5e;
  --ink-soft: #b9c3da;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Arabic', 'Segoe UI', 'Noto Sans Arabic',
    'Noto Sans', Tahoma, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --radius: 14px;
  --tap: 44px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #000000;
    --page: #000000;
    --fg: #f2f2f5;
    --muted: #a1a1aa;
    --faint: #6c6c74;
    --line: #232327;
    --accent: #7ea6ff;
    --accent-fg: #06080d;
    --accent-soft: #14203a;
    --tag-bg: #2d2714;
    --tag-fg: #e6cc80;
    --scrim: rgba(0, 0, 0, 0.6);
    --surface: #1d1d20;
    --sheet: #121214;
    --sel-bg: #7ea6ff;
    --sel-fg: #06080d;
    --danger: #ff6b63;
    --ink: #a9bdf2;
    --ink-soft: #2e3550;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #000000;
  --page: #000000;
  --fg: #f2f2f5;
  --muted: #a1a1aa;
  --faint: #6c6c74;
  --line: #232327;
  --accent: #7ea6ff;
  --accent-fg: #06080d;
  --accent-soft: #14203a;
  --tag-bg: #2d2714;
  --tag-fg: #e6cc80;
  --scrim: rgba(0, 0, 0, 0.6);
  --surface: #1d1d20;
  --sheet: #121214;
  --sel-bg: #7ea6ff;
  --sel-fg: #06080d;
  --danger: #ff6b63;
  --ink: #a9bdf2;
  --ink-soft: #2e3550;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button,
input,
textarea {
  font: inherit;
  color: inherit;
}
button {
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 8px;
}
.tnum,
.time,
.week-num {
  font-variant-numeric: tabular-nums;
}
bdi.time {
  direction: ltr;
  unicode-bidi: isolate;
}
.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.icon {
  width: 22px;
  height: 22px;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
[dir='rtl'] .flip {
  transform: scaleX(-1);
}

/* ---------- Shell ---------- */
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 640px;
  margin: 0 auto;
  background: var(--page);
}
@media (min-width: 700px) {
  body {
    padding-block: 24px;
  }
  .app {
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
  }
}

.top {
  padding-top: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  flex: none;
}
.top-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.day-title {
  flex: 1;
  min-width: 0;
  text-align: start;
  display: flex;
  flex-direction: column;
  padding-block: 2px;
}
.day-main,
.day-sub {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.day-main {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.day-sub {
  font-size: 14px;
  color: var(--muted);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-inline-end: -8px;
}
.icon-btn {
  width: var(--tap);
  height: var(--tap);
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--muted);
}
.icon-btn:active {
  background: var(--accent-soft);
}
.pill {
  height: 32px;
  padding-inline: 12px;
  border-radius: 16px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
}

.week {
  margin-inline: -6px;
  padding-block: 4px 6px;
}
.week-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  min-width: 0;
}
.week-day {
  height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border-radius: 12px;
  position: relative;
}
.week-name {
  font-size: 11px;
  color: var(--faint);
}
.week-num {
  font-size: 16px;
  font-weight: 600;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}
.week-day.is-today .week-num {
  color: var(--accent);
}
.week-day[aria-current='date'] .week-num {
  background: var(--sel-bg);
  color: var(--sel-fg);
}
.week-day.has-tasks::after {
  content: '';
  position: absolute;
  bottom: 3px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--faint);
}

.status {
  margin: 0 0 8px;
  font-size: 13px;
  color: var(--muted);
}

/* ---------- Day page ---------- */
.main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  /* Room below the last task: a tap there starts a new one. */
  padding-block: 4px 96px;
}
.section-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 18px 0 2px;
}
.tasks {
  list-style: none;
  margin: 0;
  padding: 0;
}
.task {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--line);
  min-height: 56px;
}
.check {
  flex: none;
  width: var(--tap);
  display: grid;
  place-items: center;
  margin-inline-start: -10px;
}
.check-ring {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.8px solid var(--faint);
  display: grid;
  place-items: center;
  transition: background-color 0.12s, border-color 0.12s;
}
.check-ring svg {
  width: 14px;
  height: 14px;
  stroke: var(--accent-fg);
  stroke-width: 2.6;
  fill: none;
  opacity: 0;
}
.task.done .check-ring {
  background: var(--accent);
  border-color: var(--accent);
}
.task.done .check-ring svg {
  opacity: 1;
}
.task-body {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: start;
  padding-block: 10px;
}
.task-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.task-title {
  font-size: 17px;
  overflow-wrap: anywhere;
}
/* Mixed-language titles keep their own reading direction but line up with
   the interface, so the list stays one clean column. */
.task-title,
.note-preview,
.conflict-value {
  text-align: match-parent;
}
.task.done .task-title {
  color: var(--done-fg, var(--faint));
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}
.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}
/* First line of a note, under the title. */
.note-preview {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tag {
  font-size: 12px;
  padding: 1px 7px;
  border-radius: 6px;
  background: var(--tag-bg);
  color: var(--tag-fg);
}
/* The time margin, like the ruled margin of a pocket diary. */
.task-time {
  flex: none;
  width: 52px;
  text-align: end;
  display: flex;
  flex-direction: column;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.25;
  padding-inline-start: 10px;
  border-inline-start: 1px solid var(--line);
  align-self: stretch;
  justify-content: center;
}
.task-time .end {
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
}
.task.done .task-time {
  color: var(--faint);
}
.task.current .task-time .start {
  color: var(--accent);
}
.now-line {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  margin: -1px 0;
  position: relative;
  height: 22px;
}
.now-line::before,
.now-line::after {
  content: '';
  height: 1.5px;
  background: var(--accent);
  flex: 1;
}
.now-line::before {
  flex: 0 0 6px;
}

.carry {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface);
  color: var(--muted);
  font-size: 14px;
  text-align: start;
}
.empty {
  padding: 40px 8px 16px;
  color: var(--muted);
  text-align: center;
}
.empty strong {
  display: block;
  color: var(--fg);
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 6px;
}
.empty p {
  margin: 0 auto;
  max-width: 30ch;
  font-size: 14px;
  text-wrap: balance;
}

/* ---------- Composer ---------- */
.composer {
  flex: none;
  border-top: 1px solid var(--line);
  background: var(--page);
  padding-top: 8px;
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.parse {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 6px;
}
.parse-chip {
  font-size: 13px;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 8px;
  padding: 4px 8px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.parse-x {
  height: 28px;
  padding-inline: 8px;
  font-size: 13px;
  color: var(--muted);
}
.composer-form {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border-radius: 24px;
  padding-inline: 16px 4px;
  border: 1px solid transparent;
}
.composer-form:focus-within {
  border-color: var(--line);
}
.composer-input {
  flex: 1;
  min-width: 0;
  height: 48px;
  border: 0;
  background: transparent;
  outline: none;
  font-size: 17px;
}
.composer-input::placeholder {
  color: var(--faint);
}
.send {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-fg);
  display: grid;
  place-items: center;
  flex: none;
}
.send[disabled] {
  background: var(--line);
  color: var(--faint);
  cursor: default;
}
.send .icon {
  width: 20px;
  height: 20px;
  stroke-width: 2.2;
}

/* ---------- Sheets ---------- */
.sheet-layer {
  position: fixed;
  inset: 0;
  z-index: 20;
}
.backdrop {
  position: absolute;
  inset: 0;
  background: var(--scrim);
}
.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 90%;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--sheet);
  border-radius: 18px 18px 0 0;
  padding-top: 8px;
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  animation: rise 0.12s ease-out;
}
@keyframes rise {
  from {
    transform: translateY(16px);
  }
}
@media (min-width: 700px) {
  .sheet {
    left: 50%;
    right: auto;
    bottom: auto;
    top: 50%;
    width: 480px;
    max-height: 86%;
    transform: translate(-50%, -50%);
    border-radius: 18px;
    animation: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .sheet {
    animation: none;
  }
  .check-ring {
    transition: none;
  }
}
.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: var(--tap);
  position: sticky;
  top: -8px;
  background: var(--sheet);
  z-index: 1;
}
.sheet-head h2 {
  font-size: 17px;
  margin: 0;
}
.text-btn {
  min-height: var(--tap);
  padding-inline: 8px;
  color: var(--accent);
  font-weight: 600;
  font-size: 16px;
}
.text-btn.quiet {
  color: var(--muted);
  font-weight: 400;
}
.text-btn.danger {
  color: var(--danger);
  font-weight: 600;
}
/* Separates the hour grid from the minute grid. */
.picker-divider {
  height: 1px;
  background: var(--line);
  margin-block: 4px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-block: 12px;
  border-bottom: 1px solid var(--line);
}
.field:last-of-type {
  border-bottom: 0;
}
.field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.title-input,
.notes-input,
.text-input {
  width: 100%;
  border: 0;
  outline: none;
  background: transparent;
  resize: none;
  font-size: 17px;
  padding: 0;
}
.title-input {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
}
.notes-input {
  min-height: 60px;
  font-size: 16px;
}
.text-input {
  height: 48px;
  padding-inline: 14px;
  border-radius: 12px;
  background: var(--surface);
  font-size: 17px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  min-height: 36px;
  padding-inline: 12px;
  border-radius: 18px;
  background: var(--surface);
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip[aria-pressed='true'] {
  background: var(--sel-bg);
  color: var(--sel-fg);
}
.time-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.time-btn {
  min-width: 84px;
  height: 44px;
  border-radius: 12px;
  background: var(--surface);
  font-size: 20px;
  font-weight: 600;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.1;
}
.time-btn small {
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
}
.time-btn[aria-expanded='true'] {
  outline: 2px solid var(--accent);
  outline-offset: 0;
}
.dash {
  color: var(--faint);
}
.picker {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  border-radius: 14px;
  background: var(--surface);
}
.grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
}
.grid button {
  height: 40px;
  border-radius: 10px;
  font-size: 16px;
  background: var(--sheet);
}
.grid button[aria-pressed='true'] {
  background: var(--accent);
  color: var(--accent-fg);
  font-weight: 600;
}
.picker-label {
  font-size: 12px;
  color: var(--muted);
}
.month-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.month-head strong {
  font-size: 15px;
}
.month {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.month .dow {
  font-size: 11px;
  color: var(--faint);
  text-align: center;
  padding-block: 4px;
}
.month button {
  height: 40px;
  border-radius: 10px;
  font-size: 15px;
}
.month button.other {
  color: var(--faint);
}
.month button.is-today {
  color: var(--accent);
  font-weight: 700;
}
.month button[aria-pressed='true'] {
  background: var(--sel-bg);
  color: var(--sel-fg);
}
.note {
  font-size: 13px;
  color: var(--muted);
  margin: 0;
}
.overlap-note {
  color: var(--tag-fg);
}
.sheet-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding-top: 12px;
}
.btn {
  min-height: 48px;
  padding-inline: 18px;
  border-radius: 14px;
  background: var(--surface);
  font-weight: 600;
  font-size: 16px;
}
.btn.primary {
  background: var(--accent);
  color: var(--accent-fg);
}
.btn.block {
  width: 100%;
}
.btn[disabled] {
  opacity: 0.5;
  cursor: default;
}
.conflict {
  border-radius: 12px;
  background: var(--tag-bg);
  color: var(--tag-fg);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 14px;
}
.conflict-value {
  color: var(--fg);
  font-size: 16px;
  overflow-wrap: anywhere;
}
.conflict .chips .chip {
  background: var(--sheet);
  color: var(--fg);
}
.carry-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-block: 10px;
  border-bottom: 1px solid var(--line);
}
.carry-item .task-text {
  flex: 1;
}
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 48px;
  width: 100%;
  text-align: start;
}
.seg {
  display: inline-flex;
  background: var(--surface);
  border-radius: 12px;
  padding: 3px;
}
.seg button {
  min-height: 38px;
  padding-inline: 14px;
  border-radius: 10px;
  font-size: 15px;
}
.seg button[aria-pressed='true'] {
  background: var(--sheet);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}
.prose {
  font-size: 14px;
  color: var(--muted);
  margin: 0;
  line-height: 1.55;
}

/* ---------- Toast ---------- */

<script>
(function () {
'use strict';
// ---- digits.js ----
// Every digit shown or stored by the app is a Western digit (0-9), whatever
// the interface language or keyboard. These helpers convert the other digit
// scripts a user can realistically type or paste.

const DIGIT_BASES = [
  0x0660, // Arabic-Indic        ٠١٢٣٤٥٦٧٨٩
  0x06f0, // Extended (Persian)  ۰۱۲۳۴۵۶۷۸۹
  0xff10, // Full-width          ０１２３４５６７８９
];
const NON_WESTERN_DIGITS = /[٠-٩۰-۹０-９٫٬：]/g;

function normalizeDigits(input) {
  if (input == null) return '';
  return String(input).replace(NON_WESTERN_DIGITS, (ch) => {
    const code = ch.charCodeAt(0);
    if (ch === '٫') return '.'; // Arabic decimal separator
    if (ch === '٬') return ','; // Arabic thousands separator
    if (ch === '：') return ':'; // Full-width colon
    for (const base of DIGIT_BASES) {
      if (code >= base && code <= base + 9) return String(code - base);
    }
    return ch;
  });
}

function hasNonWesternDigits(input) {
  NON_WESTERN_DIGITS.lastIndex = 0;
  const found = NON_WESTERN_DIGITS.test(String(input || ''));
  NON_WESTERN_DIGITS.lastIndex = 0;
  return found;
}

// Normalizes an <input>/<textarea> in place as the user types or pastes.
// The mapping is one character to one character, so the caret stays put.
function bindDigitNormalization(el) {
  const apply = () => {
    const value = el.value;
    if (!hasNonWesternDigits(value)) return;
    let start = null;
    let end = null;
    try {
      start = el.selectionStart;
      end = el.selectionEnd;
    } catch (_) {
      // Some input types (time, date) don't expose a selection.
    }
    el.value = normalizeDigits(value);
    if (start != null) {
      try {
        el.setSelectionRange(start, end);
      } catch (_) {}
    }
  };
  el.addEventListener('input', (e) => {
    if (e.isComposing) return;
    apply();
  });
  el.addEventListener('compositionend', apply);
  el.addEventListener('change', apply);
  return apply;
}

// ---- dates.js ----
// Calendar days are stored as local 'YYYY-MM-DD' keys and times as 'HH:MM'
// (24-hour). Formatting is done by hand or through Intl with the Latin
// numbering system, so no Arabic-Indic digit can reach the screen.

const pad2 = (n) => String(n).padStart(2, '0');

function dayKey(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function todayKey(now = new Date()) {
  return dayKey(now);
}

// Noon avoids daylight-saving edges when doing day arithmetic.
function keyToDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d, 12, 0, 0, 0);
}

function isDayKey(key) {
  if (typeof key !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return false;
  return dayKey(keyToDate(key)) === key;
}

function addDays(key, n) {
  const d = keyToDate(key);
  d.setDate(d.getDate() + n);
  return dayKey(d);
}

function diffDays(a, b) {
  return Math.round((keyToDate(b) - keyToDate(a)) / 86400000);
}

function formatDateNumeric(key) {
  const [y, m, d] = key.split('-');
  return `${d}/${m}/${y}`;
}

function formatDateShort(key) {
  const [, m, d] = key.split('-');
  return `${d}/${m}`;
}

function intlLocale(lang) {
  return lang === 'ar' ? 'ar-u-nu-latn-ca-gregory' : 'en-GB-u-nu-latn-ca-gregory';
}

function weekdayName(key, lang, style = 'long') {
  return new Intl.DateTimeFormat(intlLocale(lang), { weekday: style }).format(keyToDate(key));
}

function monthName(key, lang) {
  return new Intl.DateTimeFormat(intlLocale(lang), { month: 'long' }).format(keyToDate(key));
}

// First day of the week (0 = Sunday ... 6 = Saturday) for the device's
// region, falling back to the usual convention for the interface language.
function firstDayOfWeek(lang, navigatorLang) {
  try {
    const loc = new Intl.Locale(navigatorLang || (lang === 'ar' ? 'ar' : 'en-US'));
    const info = typeof loc.getWeekInfo === 'function' ? loc.getWeekInfo() : loc.weekInfo;
    if (info && info.firstDay) return info.firstDay % 7;
  } catch (_) {}
  return lang === 'ar' ? 6 : 0;

function weekDays(key, firstDay) {
  const d = keyToDate(key);
  const offset = (d.getDay() - firstDay + 7) % 7;
  const start = addDays(key, -offset);

// --- Times -----------------------------------------------------------------

function isTime(t) {
  return typeof t === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(t);

function toMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function fromMinutes(mins) {
  const m = ((Math.round(mins) % 1440) + 1440) % 1440;
  return `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;

function addMinutes(t, n) {
  return fromMinutes(toMinutes(t) + n);

// Duration in minutes; an end before the start runs past midnight.
function durationMinutes(start, end) {
  if (!isTime(start) || !isTime(end)) return null;
  let d = toMinutes(end) - toMinutes(start);

function formatDuration(mins, lang) {
  if (mins == null) return '';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  const H = lang === 'ar' ? 'س' : 'h';
  const M = lang === 'ar' ? 'د' : 'm';
  if (h && m) return `${h}${H} ${m}${M}`;
  if (h) return `${h}${H}`;

function nextQuarter(now = new Date()) {
  const mins = now.getHours() * 60 + now.getMinutes();
  return fromMinutes(Math.ceil((mins + 1) / 15) * 15);

// ---- parse.js ----
// Local, private quick-add parsing: "قراءة كتاب 20:00-20:30",

const RE_RANGE = new RegExp(`${PRE}(?:(من|from)\\s+)?${TIME}${RANGE_SEP}${TIME}${END}`, 'giu');
const RE_SINGLE = new RegExp(`${PRE}(?:(الساعة|الساعه|at|@)\\s*)?${TIME}${END}`, 'giu');
const RE_DURATION = new RegExp(

  'iu',
);

const AR_DAYS = { احد: 0, أحد: 0, اثنين: 1, إثنين: 1, أثنين: 1, ثلاثاء: 2, ثلاثا: 2, اربعاء: 3, أربعاء: 3, خميس: 4, جمعة: 5, جمعه: 5, سبت: 6 };
const EN_DAYS = { sunday: 0, monday: 1, mon: 1, tuesday: 2, tue: 2, tues: 2, wednesday: 3, wed: 3, thursday: 4, thu: 4, thurs: 4, friday: 5, fri: 5, saturday: 6 };

const RE_REL = [
  [new RegExp(`${PRE}((?:في\\s+)?بعد\\s+(?:غد(?:اً|ًا|ا)?|بكر[ةه]|بكرا))${END}`, 'iu'), 2],
  [new RegExp(`${PRE}((?:the\\s+)?day\\s+after\\s+tomorrow)${END}`, 'iu'), 2],
  [new RegExp(`${PRE}(غد(?:اً|ًا|ا)|بكر[ةه]|بكرا)${END}`, 'iu'), 1],
  [new RegExp(`${PRE}(tomorrow|tmrw|tmr)${END}`, 'iu'), 1],
  [new RegExp(`${PRE}(اليوم|الليلة|الليله)${END}`, 'iu'), 0],
  [new RegExp(`${PRE}(today|tonight)${END}`, 'iu'), 0],
];
const RE_AR_WEEKDAY = new RegExp(
  `${PRE}((?:(?:في\\s+)?يوم\\s+)?ال(${Object.keys(AR_DAYS).join('|')}))${END}`,
  'iu',
);
const RE_EN_WEEKDAY = new RegExp(`${PRE}((?:on\\s+|next\\s+)?(${Object.keys(EN_DAYS).join('|')}))${END}`, 'iu');
const RE_NUM_DATE = new RegExp(`${PRE}((?:في\\s+|on\\s+)?(\\d{1,2})/(\\d{1,2})(?:/(\\d{2,4}))?)${END}`, 'iu');

const PM = /^(م|مساء|مساءً|مساءا|ليلا|ليلاً|ليلًا|pm|p\.m\.|p)$/i;
const AM = /^(ص|صباح|صباحا|صباحًا|صباحاً|am|a\.m\.|a)$/i;
const NOON = /^ظهر/;

function to24(h, m, mer) {
  if (m > 59) return null;
  if (!mer) return h <= 23 ? h * 60 + m : null;
  if (h < 1 || h > 12) return null;
  if (PM.test(mer)) return ((h % 12) + 12) * 60 + m;
  if (AM.test(mer)) return (h % 12) * 60 + m;
  if (NOON.test(mer)) return (h <= 4 ? h + 12 : h) * 60 + m;
  return null;
}

// Blank out a matched span, keeping string positions stable.
function blank(work, start, end) {
  return work.slice(0, start) + ' '.repeat(end - start) + work.slice(end);
}

function matchSpan(m) {
  const start = m.index + m[1].length;
  return [start, m.index + m[0].length];
}

function parseRange(work) {
  RE_RANGE.lastIndex = 0;
  let m;
  while ((m = RE_RANGE.exec(work))) {
    const [, , from, h1, m1, mer1, h2, m2, mer2] = m;
    const hasSignal = m1 != null || m2 != null || mer1 || mer2 || from;
    if (!hasSignal) continue;
    let endMin = to24(+h2, m2 ? +m2 : 0, mer2);
    let startMin = to24(+h1, m1 ? +m1 : 0, mer1 || mer2);
    if (!mer1 && mer2 && startMin != null && endMin != null && startMin > endMin) {
      startMin = to24(+h1, m1 ? +m1 : 0, null);
    }
    if (startMin == null || endMin == null) continue;
    return { span: matchSpan(m), start: fromMinutes(startMin), end: fromMinutes(endMin) };
  }
  return null;
}

function parseSingle(work) {
  RE_SINGLE.lastIndex = 0;
  let m;
  while ((m = RE_SINGLE.exec(work))) {
    const [, , at, h, mm, mer] = m;
    // A bare number ("10 eggs") is not a time.
    if (mm == null && !mer && !at) continue;
    // Single letters a/p only count right after digits ("6p"), not "6 a".
    if (mer && /^[ap]$/i.test(mer) && /\s$/.test(m[0].slice(0, m[0].length - 1))) continue;
    const mins = to24(+h, mm ? +mm : 0, mer);
    if (mins == null) continue;
    return { span: matchSpan(m), start: fromMinutes(mins) };
  }
  return null;
}

function parseDuration(rest) {
  const m = RE_DURATION.exec(rest);
  if (!m) return null;
  let mins;
  if (m[3]) {
    mins = { ساعتين: 120, ساعة: 60, ساعه: 60, 'نصف ساعة': 30, 'نص ساعة': 30, 'ربع ساعة': 15 }[m[3]];
  } else {
    const n = parseFloat(m[1]);
    mins = /^(د|دقي|دقا|m)/i.test(m[2]) ? n : n * 60;
  }
  if (!mins || mins <= 0 || mins > 1440) return null;
  return { length: m[0].length, mins: Math.round(mins) };
}

function nextWeekday(fromKey, dow) {
  const d = keyToDate(fromKey).getDay();
  return addDays(fromKey, (dow - d + 7) % 7);
}

function parseDate(work, today) {
  for (const [re, offset] of RE_REL) {
    const m = re.exec(work);
    if (m) return { span: matchSpan(m), date: addDays(today, offset) };
  }
  let m = RE_AR_WEEKDAY.exec(work);
  if (m) {
    const key = m[3].replace(/^ال/, '');
    if (key in AR_DAYS) return { span: matchSpan(m), date: nextWeekday(today, AR_DAYS[key]) };
  }
  m = RE_EN_WEEKDAY.exec(work);
  if (m) {
    const key = m[3].toLowerCase();
    if (key in EN_DAYS) return { span: matchSpan(m), date: nextWeekday(today, EN_DAYS[key]) };
  }
  m = RE_NUM_DATE.exec(work);
  if (m) {
    const d = +m[3];
    const mo = +m[4];
    let y = m[5] ? +m[5] : keyToDate(today).getFullYear();
    if (y < 100) y += 2000;
    const key = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    if (isDayKey(key)) {
      let date = key;
      if (!m[5] && diffDays(today, key) < -180) date = dayKey(new Date(y + 1, mo - 1, d, 12));
      return { span: matchSpan(m), date };
    }
  }
  return null;
}

function tidy(text) {
  return text
    .replace(/\s+/g, ' ')
    .replace(/^[\s\-–—,،:؛;]+|[\s\-–—,،:؛;]+$/g, '')
    .replace(/\s+(في|يوم|الساعة|at|on|from|من)$/iu, '')
    .trim();
}

/**
 * @param {string} raw     what the user typed
 * @param {string} today   today's day key, for words like "tomorrow"
 * @returns {{title:string, date:string|null, start:string|null, end:string|null, found:boolean}}
 */
function parseQuickAdd(raw, today) {
  const text = normalizeDigits(raw || '').replace(/\s+/g, ' ').trim();
  let work = text;
  const result = { title: text, date: null, start: null, end: null, found: false };
  if (!text) return result;

  const date = parseDate(work, today);
  if (date) {
    work = blank(work, ...date.span);
    result.date = date.date;
  }

  const range = parseRange(work);
  if (range) {
    work = blank(work, ...range.span);
    result.start = range.start;
    result.end = range.end;
  } else {
    const single = parseSingle(work);
    if (single) {
      result.start = single.start;
      const dur = parseDuration(work.slice(single.span[1]));
      let spanEnd = single.span[1];
      if (dur) {
        result.end = fromMinutes(toMinutes(single.start) + dur.mins);
        spanEnd += dur.length;
      }
      work = blank(work, single.span[0], spanEnd);
    }
  }

  result.found = Boolean(result.date || result.start);
  if (result.found) {
    const title = tidy(work);
    result.title = title || text;
  }
  return result;
}

// Lines pasted from Reminders (or produced by an iPhone Shortcut), one task
// per line. Understood forms, most specific first:
//   "2026-10-16 09:00 Morning workout"   date + time + title
//   "2026-10-16 Buy a gift"              date + title
//   "09:00 Morning workout"              time + title
//   anything else                        read like the quick-add line
const BULLETS = /^[\s•\-–—*○◯●◦☐☑✓✔▢□]+/;
const pad2i = (n) => String(n).padStart(2, '0');

function parseImportLines(raw, today) {
  const out = [];
  for (let line of normalizeDigits(raw || '').split(/\r?\n/)) {
    line = line.replace(BULLETS, '').replace(/\s+/g, ' ').trim();
    if (!line) continue;
    let m = line.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?\s+(.+)$/);
    if (m) {
      const date = `${m[1]}-${pad2i(m[2])}-${pad2i(m[3])}`;
      if (isDayKey(date)) {
        const ok = m[4] != null && +m[4] < 24 && +m[5] < 60;
        out.push({ title: m[6].trim(), date, start: ok ? `${pad2i(m[4])}:${m[5]}` : null, end: null });
        continue;
      }
    }
    m = line.match(/^(\d{1,2}):(\d{2})\s+(.+)$/);
    if (m && +m[1] < 24 && +m[2] < 60) {
      out.push({ title: m[3].trim(), date: null, start: `${pad2i(m[1])}:${m[2]}`, end: null });
      continue;
    }
    const p = parseQuickAdd(line, today);
    out.push(p.found ? { title: p.title, date: p.date, start: p.start, end: p.end } : { title: line, date: null, start: null, end: null });
  }
  return out;
}

// ---- crdt.js ----
// Conflict-free merge of task data between devices.
//
// A task is a map of registers. Each register holds a value plus a stamp
// (t: hybrid clock in ms, d: device id) and `h`, the stamps of earlier values
// it is known to descend from. Merging two registers:
//   - if one descends from the other, the newer one wins (no conflict);
//   - if they are concurrent, the higher stamp wins and, for text and
//     schedule fields, the losing value is kept in the task's conflict list
//     so nothing is lost silently.
// The merge is commutative, associative and idempotent, so every device
// converges to the same state whatever order updates arrive in.

const FIELDS = ['title', 'notes', 'when', 'done', 'del', 'rep', 'of'];
const CONFLICT_FIELDS = new Set(['title', 'notes', 'when']);
const HISTORY = 12;

const stampKey = (r) => `${r.t}.${r.d}`;

function cmpStamp(a, b) {
  if (a.t !== b.t) return a.t < b.t ? -1 : 1;
  if (a.d === b.d) return 0;
  return a.d < b.d ? -1 : 1;
}

function parseKey(k) {
  const i = k.indexOf('.');
  return { t: Number(k.slice(0, i)), d: k.slice(i + 1) };
}

// Union of stamp keys, keeping the HISTORY most recent in a fixed order.
function unionHistory(...lists) {
  const set = new Set();
  for (const l of lists) for (const k of l || []) set.add(k);
  return [...set]
    .map((k) => ({ k, ...parseKey(k) }))
    .sort((a, b) => -cmpStamp(a, b))
    .slice(0, HISTORY)
    .map((x) => x.k);
}

function stableStringify(value) {
  if (value === null || typeof value !== 'object') return JSON.stringify(value);
  if (Array.isArray(value)) return `[${value.map(stableStringify).join(',')}]`;
  const keys = Object.keys(value)
    .filter((k) => value[k] !== undefined)
    .sort();
  return `{${keys.map((k) => `${JSON.stringify(k)}:${stableStringify(value[k])}`).join(',')}}`;
}

const sameValue = (a, b) => stableStringify(a) === stableStringify(b);

// Returns { reg, lost } where `lost` is the losing register of a concurrent
// edit with a different value, if any.
function mergeRegister(a, b) {
  if (!a) return { reg: b, lost: null };
  if (!b) return { reg: a, lost: null };
  const ka = stampKey(a);
  const kb = stampKey(b);
  if (ka === kb) return { reg: { ...a, h: unionHistory(a.h, b.h) }, lost: null };

  const bFromA = (b.h || []).includes(ka);
  const aFromB = (a.h || []).includes(kb);
  let winner;
  let loser;
  let concurrent = false;
  if (bFromA && !aFromB) [winner, loser] = [b, a];
  else if (aFromB && !bFromA) [winner, loser] = [a, b];
  else {
    concurrent = true;
    [winner, loser] = cmpStamp(a, b) >= 0 ? [a, b] : [b, a];
  }
  const reg = { ...winner, h: unionHistory(winner.h, loser.h, [stampKey(loser)]) };
  const lost = concurrent && !sameValue(a.v, b.v) ? loser : null;
  return { reg, lost };
}

function makeRegister(value, stamp, previous) {
  return {
    v: value,
    t: stamp.t,
    d: stamp.d,
    h: previous ? unionHistory(previous.h, [stampKey(previous)]) : [],
  };
}

// --- Clock -------------------------------------------------------------------

function createClock(deviceId, initial = 0, now = () => Date.now()) {
  let last = initial;
  return {
    deviceId,
    next() {
      last = Math.max(now(), last + 1);
      return { t: last, d: deviceId };
    },
    observe(t) {
      if (typeof t === 'number' && t > last) last = t;
    },
    get last() {
      return last;
    },
  };
}

// --- Tasks -------------------------------------------------------------------

/**
 * Stored task: { id, c: created ms, r: {field: register}, x: {key: conflict},
 *                xd: {key: 1} dismissed conflicts }
 * conflict: { f: field, v: value, t, d }
 */
function newTask(id, fields, clock) {
  const stamp = clock.next();
  const r = {};
  for (const f of FIELDS) {
    if (fields[f] !== undefined) r[f] = makeRegister(fields[f], stamp, null);
  }
  return { id, c: stamp.t, r, x: {}, xd: {} };
}

function setField(task, field, value, clock) {
  const prev = task.r[field];
  if (prev && sameValue(prev.v, value)) return task;
  const reg = makeRegister(value, clock.next(), prev);
  return { ...task, r: { ...task.r, [field]: reg } };
}

const conflictKey = (f, reg) => `${f}:${stampKey(reg)}`;

function mergeTask(a, b) {
  if (!a) return b;
  if (!b) return a;
  const r = {};
  const x = { ...(a.x || {}), ...(b.x || {}) };
  for (const f of FIELDS) {
    const { reg, lost } = mergeRegister(a.r[f], b.r[f]);
    if (reg) r[f] = reg;
    if (lost && CONFLICT_FIELDS.has(f)) {
      x[conflictKey(f, lost)] = { f, v: lost.v, t: lost.t, d: lost.d };
    }
  }
  const xd = { ...(a.xd || {}), ...(b.xd || {}) };
  return { id: a.id, c: Math.min(a.c, b.c), r, x, xd };
}

function dismissConflicts(task, keys) {
  const xd = { ...task.xd };
  for (const k of keys) xd[k] = 1;
  return { ...task, xd };
}

// Deletion remembers which version of each field it saw. If another device
// edits the task afterwards (or concurrently), the task comes back instead of
// that edit being lost.
function deletionMarker(task) {
  const k = {};
  for (const f of ['title', 'notes', 'when', 'done', 'rep']) {
    if (task.r[f]) k[f] = stampKey(task.r[f]);
  }
  return { on: true, k };
}

function isDeleted(task) {
  const del = task.r.del && task.r.del.v;
  if (!del || !del.on) return false;
  for (const f of ['title', 'notes', 'when', 'done', 'rep']) {
    const reg = task.r[f];
    if (!reg) continue;
    if (del.k[f] !== stampKey(reg)) return false;
  }
  return true;
}

function visibleConflicts(task) {
  const out = [];
  for (const [key, c] of Object.entries(task.x || {})) {
    if (task.xd && task.xd[key]) continue;
    const current = task.r[c.f];
    if (current && sameValue(current.v, c.v)) continue;
    out.push({ key, ...c });
  }
  return out.sort((p, q) => q.t - p.t);
}

// --- Buckets -----------------------------------------------------------------

function emptyBucket() {
  return { v: 1, tasks: {} };
}

function mergeBucket(a, b) {
  if (!a) return b;
  if (!b) return a;
  const tasks = {};
  const ids = new Set([...Object.keys(a.tasks), ...Object.keys(b.tasks)]);
  for (const id of [...ids].sort()) tasks[id] = mergeTask(a.tasks[id], b.tasks[id]);
  return { v: 1, tasks };
}

function maxStamp(bucket) {
  let max = 0;
  for (const t of Object.values(bucket.tasks)) {
    for (const reg of Object.values(t.r)) if (reg.t > max) max = reg.t;
  }
  return max;
}

// ---- crypto.js ----
// End-to-end encryption with the browser's built-in Web Crypto API only.
//
// One random AES-GCM-256 "vault key" encrypts all task data. It is created
// on the first device and never sent to the sync server. Other devices get
// it from a recovery link the user sends to themselves (email, Telegram,
// notes...). No passphrase to remember.

const subtle = () => globalThis.crypto.subtle;
const enc = new TextEncoder();
const dec = new TextDecoder();

function randomBytes(n) {
  const out = new Uint8Array(n);
  globalThis.crypto.getRandomValues(out);
  return out;
}

function randomId(len = 12) {
  const bytes = randomBytes(len);
  let s = '';
  for (const b of bytes) s += 'abcdefghijkmnpqrstuvwxyz23456789'[b & 31];
  return s;
}

function toB64(bytes) {
  const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  let bin = '';
  for (let i = 0; i < u8.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

function fromB64(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const toB64url = (s) => s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const fromB64url = (s) => s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4);

/** A new vault: raw key (base64, kept on the device) and a public key id. */
function newVault() {
  return { key: toB64(randomBytes(32)), kid: randomId(10) };
}

/** The usable CryptoKey for a stored raw key. */
function importVaultKey(keyB64) {
  const raw = fromB64(keyB64);
  if (raw.length !== 32) throw new Error('bad-key');
  return subtle().importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}

// --- Recovery / pairing payload -----------------------------------------------
// Everything a new device needs, carried in the URL fragment (never sent to
// any web server): the vault key, its id and, if set, the sync settings.

function encodePairing({ key, kid, sync }) {
  const payload = { v: 1, k: key, i: kid };
  if (sync && sync.type === 'github') payload.g = { r: sync.repo, t: sync.token };
  return toB64url(btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
}

/** Accepts a full link, a "#pair=..." fragment or the bare code. */
function decodePairing(input) {
  let s = String(input || '').trim();
  const m = s.match(/[#&?]pair=([A-Za-z0-9_-]+)/);
  if (m) s = m[1];
  s = s.replace(/\s+/g, '');
  if (!/^[A-Za-z0-9_-]{20,}$/.test(s)) return null;
  try {
    const p = JSON.parse(decodeURIComponent(escape(atob(fromB64url(s)))));
    if (p.v !== 1 || typeof p.k !== 'string' || typeof p.i !== 'string') return null;
    if (fromB64(p.k).length !== 32) return null;
    const out = { key: p.k, kid: p.i, sync: null };
    if (p.g && typeof p.g.r === 'string' && typeof p.g.t === 'string') out.sync = { type: 'github', repo: p.g.r, token: p.g.t };
    return out;
  } catch (_) {
    return null;
  }
}

// --- Data encryption ---------------------------------------------------------

async function encryptJSON(dek, kid, value, aad) {
  const iv = randomBytes(12);
  const ct = await subtle().encrypt(
    { name: 'AES-GCM', iv, additionalData: enc.encode(aad) },
    dek,
    enc.encode(JSON.stringify(value)),
  );
  return { v: 1, k: kid, iv: toB64(iv), ct: toB64(ct) };
}

async function decryptJSON(dek, envelope, aad) {
  const pt = await subtle().decrypt(
    { name: 'AES-GCM', iv: fromB64(envelope.iv), additionalData: enc.encode(aad) },
    dek,
    fromB64(envelope.ct),
  );
  return JSON.parse(dec.decode(pt));
}

// ---- storage.js ----
// Device storage. IndexedDB holds the encrypted task cache, the pending
// (unsynced) flags and the non-extractable data key. A memory store stands
// in when IndexedDB is unavailable (and in tests).

function memoryStore() {
  const stores = { kv: new Map(), buckets: new Map() };
  return {
    kind: 'memory',
    async get(store, key) {
      return stores[store].get(key);
    },
    async put(store, key, value) {
      stores[store].set(key, value);
    },
    async del(store, key) {
      stores[store].delete(key);
    },
    async entries(store) {
      return [...stores[store].entries()];
    },
    async clear() {
      stores.kv.clear();
      stores.buckets.clear();
    },
  };
}

function req(r) {
  return new Promise((resolve, reject) => {
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

async function openIdbStore(name = 'pocket-time') {
  if (typeof indexedDB === 'undefined') throw new Error('no-indexeddb');
  const open = indexedDB.open(name, 1);
  open.onupgradeneeded = () => {
    const db = open.result;
    if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    if (!db.objectStoreNames.contains('buckets')) db.createObjectStore('buckets');
  };
  const db = await req(open);
  const tx = (store, mode, fn) =>
    new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      let result;
      Promise.resolve(fn(t.objectStore(store))).then((r) => (result = r), reject);
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  return {
    kind: 'idb',
    get: (store, key) => tx(store, 'readonly', (s) => req(s.get(key))),
    put: (store, key, value) => tx(store, 'readwrite', (s) => req(s.put(value, key))),
    del: (store, key) => tx(store, 'readwrite', (s) => req(s.delete(key))),
    entries: (store) =>
      tx(store, 'readonly', async (s) => {
        const [keys, values] = await Promise.all([req(s.getAllKeys()), req(s.getAll())]);
        return keys.map((k, i) => [k, values[i]]);
      }),
    clear: () =>
      new Promise((resolve, reject) => {
        const t = db.transaction(['kv', 'buckets'], 'readwrite');
        t.objectStore('kv').clear();
        t.objectStore('buckets').clear();
        t.oncomplete = () => resolve();
        t.onerror = () => reject(t.error);
      }),
  };
}

// ---- sync.js ----
// Local-first sync engine.
//
// Tasks live in "buckets" (one per creating device and month, at most
// BUCKET_LIMIT tasks; a task never changes bucket). Every change is written
// to the device store first, then pushed to the server as ciphertext. Remote
// buckets are merged field by field (see crdt.js); when a merge leaves this
// device with something the server copy lacks, the merged bucket is pushed
// again, so concurrent writers converge.


const BUCKET_LIMIT = 40;
const TITLE_MAX = 300;
const NOTES_MAX = 2000;
const bucketAad = (id) => `pocket-time/v1/bucket/${id}`;

// Repeating tasks. A series is a hidden template record with a `rep` rule:
//   { freq: 'daily' } or { freq: 'days', days: [0..6] }, plus optional `until`.
// Its occurrences are shown on matching days without being stored. The first
// time one is touched (done, edited, moved, deleted) it is stored under a
// predictable id, so two devices touching the same occurrence merge into one.
const occurrenceId = (seriesId, date) => `${seriesId}~${date}`;

function parseOccurrenceId(id) {
  const m = /^([a-z0-9]+)~(\d{4}-\d{2}-\d{2})$/.exec(String(id || ''));
  return m ? { series: m[1], date: m[2] } : null;
}

function hashString(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(36);
}

function occursOn(series, date) {
  const r = series && series.rule;
  if (!r || date < series.from || (r.until && date > r.until)) return false;
  if (r.freq === 'daily') return true;
  const [y, mo, d] = date.split('-').map(Number);
  return Array.isArray(r.days) && r.days.includes(new Date(y, mo - 1, d, 12).getDay());
}

function cleanTitle(s) {
  return normalizeDigits(String(s || ''))
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, TITLE_MAX);
}

function cleanNotes(s) {
  return normalizeDigits(String(s || '')).slice(0, NOTES_MAX);
}

class SyncEngine {
  constructor({ store, remote, dek, kid, deviceId, now = () => Date.now(), onKeyMismatch, flushDelay = 300 }) {
    this.store = store;
    this.remote = remote || null;
    this.dek = dek;
    this.kid = kid;
    this.deviceId = deviceId;
    this.now = now;
    this.onKeyMismatch = onKeyMismatch || (() => {});
    this.clock = createClock(deviceId, 0, now);
    this.buckets = new Map();
    this.index = new Map(); // task id -> bucket id
    this.dirty = new Set();
    this.inflight = new Set();
    this.remoteCanon = new Map();
    this.persistChains = new Map();
    this.listeners = new Set();
    this.failures = 0;
    this.lastSync = null;
    this.remoteQueue = Promise.resolve();
    this.flushTimer = null;
    this.unsubscribe = null;
    this.stopped = false;
    this.keyMismatch = false;
    this.lastError = null;
    this.flushDelay = flushDelay;
  }

  // --- lifecycle -------------------------------------------------------------

  async load() {
    const rows = await this.store.entries('buckets');
    for (const [id, row] of rows) {
      if (!row || !row.env || row.env.k !== this.kid) continue;
      try {
        const state = await decryptJSON(this.dek, row.env, bucketAad(id));
        this._setBucket(id, state);
        if (row.dirty) this.dirty.add(id);
      } catch (_) {
        // Unreadable local row: the server copy will replace it.
      }
    }
    this._emit();
  }

  start() {
    if (!this.remote || this.unsubscribe) return;
    this.stopped = false;
    this.unsubscribe = this.remote.subscribe(
      (changes) => {
        this.remoteQueue = this.remoteQueue.then(() => this._applyRemote(changes)).catch(() => {});
      },
      (err, info) => this._onSubscribeError(err, info),
    );
    this.flush();
  }

  stop() {
    this.stopped = true;
    if (this.unsubscribe) this.unsubscribe();
    this.unsubscribe = null;
    clearTimeout(this.flushTimer);
  }

  _onSubscribeError(err, info) {
    if (info && info.fatal === false) {
      this.lastError = err && err.code;
      this._emit();
      return;
    }
    this.unsubscribe = null;
    this.failures++;
    this._emit();
    const code = err && err.code;
    if (code === 'revoked' || code === 'not_granted' || this.stopped) return;
    setTimeout(() => this.start(), Math.min(30000, 2000 * this.failures));
  }

  onChange(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  }

  _emit() {
    for (const fn of this.listeners) fn();
  }

  // --- state helpers ---------------------------------------------------------

  _setBucket(id, state) {
    this.buckets.set(id, state);
    for (const tid of Object.keys(state.tasks)) this.index.set(tid, id);
    this.clock.observe(maxStamp(state));
  }

  _persist(id) {
    const prev = this.persistChains.get(id) || Promise.resolve();
    const next = prev
      .then(async () => {
        const state = this.buckets.get(id);
        if (!state) return;
        const env = await encryptJSON(this.dek, this.kid, state, bucketAad(id));
        await this.store.put('buckets', id, { env, dirty: this.dirty.has(id) });
      })
      .catch(() => {});
    this.persistChains.set(id, next);
    return next;
  }

  async whenPersisted() {
    await Promise.all([...this.persistChains.values()]);
  }

  _bucketForNew() {
    const d = new Date(this.now());
    const month = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}`;
    const prefix = `b-${month}-${this.deviceId.slice(0, 8)}-`;
    let n = 0;
    for (const id of this.buckets.keys()) {
      if (id.startsWith(prefix)) n = Math.max(n, Number(id.slice(prefix.length)) || 0);
    }
    const id = prefix + n;
    const b = this.buckets.get(id);
    if (b && Object.keys(b.tasks).length >= BUCKET_LIMIT) return prefix + (n + 1);
    return id;
  }

  _commit(bucketId, task) {
    const bucket = this.buckets.get(bucketId) || emptyBucket();
    this._setBucket(bucketId, { ...bucket, tasks: { ...bucket.tasks, [task.id]: task } });
    this.dirty.add(bucketId);
    this._persist(bucketId);
    this._emit();
    this.scheduleFlush();
  }

  _task(id) {
    const b = this.index.get(id);
    return b ? this.buckets.get(b).tasks[id] : null;
  }

  // --- public operations -----------------------------------------------------

  create({ title, notes = '', date, start = null, end = null, done = false }) {
    const id = randomId(12);
    const fields = { title: cleanTitle(title), when: { date, s: start || null, e: start ? end || null : null }, done };
    if (notes) fields.notes = cleanNotes(notes);
    const task = newTask(id, fields, this.clock);
    this._commit(this._bucketForNew(), task);
    return id;
  }

  update(id, patch) {
    let task = this._task(id);
    if (!task) return;
    if ('title' in patch) {
      const title = cleanTitle(patch.title);
      if (title) task = setField(task, 'title', title, this.clock);
    }
    if ('notes' in patch) task = setField(task, 'notes', cleanNotes(patch.notes), this.clock);
    if ('done' in patch) task = setField(task, 'done', Boolean(patch.done), this.clock);
    if ('rep' in patch) task = setField(task, 'rep', patch.rep, this.clock);
    if ('of' in patch) task = setField(task, 'of', patch.of, this.clock);
    if ('when' in patch) {
      const cur = (task.r.when && task.r.when.v) || {};
      const w = { date: cur.date, s: cur.s || null, e: cur.e || null, ...patch.when };
      if (!w.s) w.e = null;
      task = setField(task, 'when', w, this.clock);
    }
    if (task !== this._task(id)) this._commit(this.index.get(id), task);
  }

  remove(id) {
    const task = this._task(id);
    if (!task) return;
    this._commit(this.index.get(id), setField(task, 'del', deletionMarker(task), this.clock));
  }

  restore(id) {
    const task = this._task(id);
    if (!task) return;
    this._commit(this.index.get(id), setField(task, 'del', { on: false }, this.clock));
  }

  resolveConflict(id, key, useIt) {
    let task = this._task(id);
    if (!task || !task.x[key]) return;
    const c = task.x[key];
    if (useIt) {
      task = setField(task, c.f, c.v, this.clock);
      const sameField = Object.keys(task.x).filter((k) => task.x[k].f === c.f);
      task = dismissConflicts(task, sameField);
    } else {
      task = dismissConflicts(task, [key]);
    }
    this._commit(this.index.get(id), task);
  }

  /** Whether a record with this id exists (deleted ones included). */
  exists(id) {
    return this.index.has(id);
  }

  createSeries({ title, notes = '', start = null, end = null, from, rule }) {
    const id = randomId(12);
    const fields = { title: cleanTitle(title), when: { date: from, s: start || null, e: start ? end || null : null }, done: false, rep: rule };
    if (notes) fields.notes = cleanNotes(notes);
    this._commit(this._bucketForNew(), newTask(id, fields, this.clock));
    return id;
  }

  series() {
    const out = [];
    for (const bucket of this.buckets.values()) {
      for (const t of Object.values(bucket.tasks)) {
        if (!t.r.rep || !t.r.rep.v || isDeleted(t)) continue;
        const when = (t.r.when && t.r.when.v) || {};
        out.push({
          id: t.id,
          title: normalizeDigits((t.r.title && t.r.title.v) || ''),
          notes: normalizeDigits((t.r.notes && t.r.notes.v) || ''),
          start: when.s || null,
          end: when.s ? when.e || null : null,
          from: when.date,
          rule: t.r.rep.v,
          created: t.c,
        });
      }
    }
    return out;
  }

  /** Stores an occurrence of a series (if not stored yet) and returns its id. */
  materialize(seriesId, date) {
    const id = occurrenceId(seriesId, date);
    if (this.index.has(id)) return id;
    const s = this.series().find((x) => x.id === seriesId);
    if (!s) return null;
    const fields = { title: s.title, when: { date, s: s.start, e: s.end }, done: false, of: seriesId };
    if (s.notes) fields.notes = s.notes;
    // Starting values get a stamp that every device computes the same way,
    // so a later edit on one device always beats the defaults of another.
    const r = {};
    for (const [f, v] of Object.entries(fields)) r[f] = { v, t: 0, d: 'seed-' + hashString(stableStringify(v)), h: [] };
    this._commit(`r-${seriesId.slice(0, 10)}-${date.slice(0, 7).replace('-', '')}`, { id, c: s.created, r, x: {}, xd: {} });
    return id;
  }

  tasks() {
    const out = [];
    for (const [bucketId, bucket] of this.buckets) {
      for (const t of Object.values(bucket.tasks)) {
        if (isDeleted(t) || (t.r.rep && t.r.rep.v)) continue;
        const when = (t.r.when && t.r.when.v) || {};
        if (!when.date) continue;
        out.push({
          id: t.id,
          bucket: bucketId,
          title: normalizeDigits((t.r.title && t.r.title.v) || ''),
          notes: normalizeDigits((t.r.notes && t.r.notes.v) || ''),
          date: when.date,
          start: when.s || null,
          end: when.s ? when.e || null : null,
          done: Boolean(t.r.done && t.r.done.v),
          created: t.c,
          of: (t.r.of && t.r.of.v) || null,
          conflicts: visibleConflicts(t),
        });
      }
    }
    return out;
  }

  get(id) {
    return this.tasks().find((t) => t.id === id) || null;
  }

  // --- sync ------------------------------------------------------------------

  status() {
    if (this.keyMismatch) return { state: 'locked' };
    if (!this.remote) return { state: 'local' };
    if (this.dirty.size === 0 && this.failures === 0) return { state: 'synced', lastSync: this.lastSync };
    if (this.lastError === 'auth') return { state: 'auth', pending: this.dirty.size };
    if (this.failures > 0) return { state: 'offline', pending: this.dirty.size };
    return { state: 'syncing', pending: this.dirty.size };
  }

  refresh() {
    if (this.remote && this.remote.refresh) this.remote.refresh();
  }

  scheduleFlush(delay = this.flushDelay) {
    if (!this.remote) return;
    clearTimeout(this.flushTimer);
    this.flushTimer = setTimeout(() => this.flush(), delay);
  }

  flush() {
    if (!this.remote || this.stopped || this.keyMismatch) return Promise.resolve();
    const jobs = [];
    for (const id of this.dirty) if (!this.inflight.has(id)) jobs.push(this._push(id));
    return Promise.all(jobs);
  }

  async _push(id) {
    this.inflight.add(id);
    const state = this.buckets.get(id);
    const canon = stableStringify(state);
    let ok = false;
    try {
      const env = await encryptJSON(this.dek, this.kid, state, bucketAad(id));
      await this.remote.write(id, env);
      ok = true;
      this.remoteCanon.set(id, canon);
      if (stableStringify(this.buckets.get(id)) === canon) this.dirty.delete(id);
      this.failures = 0;
      this.lastError = null;
      this.lastSync = this.now();
      this._persist(id);
    } catch (e) {
      if (e && e.code === 'conflict') {
        // Another device wrote first: merge its version, then push again.
        if (e.latest) await this._applyRemote([{ id, body: e.latest }]);
        this.inflight.delete(id);
        this.dirty.add(id);
        this.scheduleFlush(50);
        return;
      }
      this.lastError = (e && e.code) || 'unavailable';
      this.failures++;
      clearTimeout(this.retryTimer);
      this.retryTimer = setTimeout(() => this.flush(), Math.min(30000, 1000 * 2 ** Math.min(this.failures, 5)));
    } finally {
      this.inflight.delete(id);
      this._emit();
      if (ok && this.dirty.has(id)) this.scheduleFlush(50);
    }
  }

  async _applyRemote(changes) {
    let touched = false;
    for (const { id, body } of changes) {
      if (!body || !body.ct) continue;
      if (body.k !== this.kid) {
        this.keyMismatch = true;
        this.onKeyMismatch();
        continue;
      }
      let remoteState;
      try {
        remoteState = await decryptJSON(this.dek, body, bucketAad(id));
      } catch (_) {
        continue;
      }
      const remoteCanon = stableStringify(remoteState);
      this.remoteCanon.set(id, remoteCanon);
      const local = this.buckets.get(id);
      const merged = mergeBucket(local, remoteState);
      const mergedCanon = stableStringify(merged);
      const localChanged = !local || stableStringify(local) !== mergedCanon;
      this._setBucket(id, merged);
      if (mergedCanon !== remoteCanon) this.dirty.add(id);
      else if (!this.inflight.has(id)) this.dirty.delete(id);
      if (localChanged || !this.dirty.has(id)) this._persist(id);
      touched = true;
    }
    if (touched) {
      if (this.dirty.size === 0) this.failures = 0;
      if (this.lastError === 'auth') this.lastError = null;
      this.lastSync = this.now();
      this._emit();
      this.scheduleFlush();
    }
  }

  // Re-encrypts everything under a new key (used when a device-only vault
  // joins sync) and queues every bucket for upload.
  async adoptKey(dek, kid, remote) {
    this.dek = dek;
    this.kid = kid;
    if (remote) this.remote = remote;
    this.keyMismatch = false;
    for (const id of this.buckets.keys()) {
      this.dirty.add(id);
      this._persist(id);
    }
    await this.whenPersisted();
    this._emit();
  }

  exportPlain() {
    return this.tasks()
      .sort((a, b) => (a.date + (a.start || '~')).localeCompare(b.date + (b.start || '~')) || a.created - b.created)
      .map(({ title, notes, date, start, end, done }) => ({ title, notes, date, start, end, done }));
  }
}

// ---- remote.js ----
// Sync servers. Everything they receive is already encrypted. Two options
// share one small interface:
//
//   ensureVault(kid) -> 'ok' | 'created' | 'mismatch'
//   subscribe(onChanges, onError) -> unsubscribe
//   write(id, envelope)            (throws {code:'conflict', latest} on a race)
//   refresh()                      (check for changes now)
//
// 1. GitHub: a private repository the user owns, reached with a fine-grained
//    token the user creates (Contents: read & write on that one repository).
//    Files: pt/meta.json (vault id) and pt/b/<bucket>.json (ciphertext).
// 2. claude.ai artifact database, when the page runs inside claude.ai:
//    data/users/<uid>/meta and data/users/<uid>/vault/b/<bucket>.

const GITHUB_API = 'https://api.github.com';

const b64json = (obj) => btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
const unb64json = (s) => JSON.parse(decodeURIComponent(escape(atob(String(s).replace(/\s/g, '')))));

function httpError(res) {
  const s = res.status;
  const code = s === 401 || s === 403 ? 'auth' : s === 404 ? 'not_found' : s === 409 || s === 422 ? 'conflict' : 'unavailable';
  return Object.assign(new Error(code), { code, status: s });
}

function githubRemote({ repo, token, fetchImpl, api = GITHUB_API, pollMs = 10000 }) {
  const doFetch = fetchImpl || ((...a) => fetch(...a));
  const base = `${api}/repos/${repo}/contents/pt`;
  const shas = new Map();
  let etag = null;
  let timer = null;
  let listener = null;
  let onError = null;
  let polling = Promise.resolve();

  const request = (url, opts = {}) =>
    doFetch(url, {
      ...opts,
      cache: 'no-store',
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        ...(opts.headers || {}),
      },
    });

  async function getFile(path) {
    const res = await request(`${base}/${path}`);
    if (res.status === 404) return null;
    if (!res.ok) throw httpError(res);
    const j = await res.json();
    return { sha: j.sha, body: unb64json(j.content) };
  }

  async function putFile(path, body, sha) {
    return request(`${base}/${path}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'Pocket Time sync', content: b64json(body), ...(sha ? { sha } : {}) }),
    });
  }

  async function poll() {
    const res = await request(`${base}/b`, { headers: etag ? { 'If-None-Match': etag } : {} });
    if (res.status === 304 || res.status === 404) return;
    if (!res.ok) throw httpError(res);
    etag = res.headers.get('ETag');
    const list = await res.json();
    const changes = [];
    for (const f of Array.isArray(list) ? list : []) {
      if (f.type !== 'file' || !f.name.endsWith('.json')) continue;
      const id = f.name.slice(0, -5);
      if (shas.get(id) === f.sha) continue;
      const file = await getFile(`b/${f.name}`);
      if (!file) continue;
      shas.set(id, file.sha);
      changes.push({ id, body: file.body });
    }
    if (changes.length && listener) await listener(changes);
  }

  function schedule(ms) {
    clearTimeout(timer);
    if (!listener) return;
    timer = setTimeout(() => remote.refresh(), ms);
  }

  const remote = {
    kind: 'github',
    repo,

    async ensureVault(kid) {
      const info = await request(`${api}/repos/${repo}`);
      if (!info.ok) throw httpError(info);
      const meta = await info.json();
      if (meta && meta.private === false) throw Object.assign(new Error('public'), { code: 'public_repo' });
      const existing = await getFile('meta.json');
      if (existing) return existing.body.kid === kid ? 'ok' : 'mismatch';
      const res = await putFile('meta.json', { v: 1, kid });
      if (res.status === 409 || res.status === 422) {
        const now = await getFile('meta.json');
        return now && now.body.kid === kid ? 'ok' : 'mismatch';
      }
      if (!res.ok) throw httpError(res);
      return 'created';
    },

    subscribe(onChanges, errorCb) {
      listener = onChanges;
      onError = errorCb;
      remote.refresh();
      return () => {
        listener = null;
        clearTimeout(timer);
      };
    },

    refresh() {
      if (!listener) return polling;
      polling = polling
        .then(() => poll())
        .then(
          () => schedule(pollMs),
          (e) => {
            schedule(Math.min(pollMs * 3, 60000));
            if (onError && e && e.code === 'auth') onError(e, { fatal: false });
          },
        );
      return polling;
    },

    async write(id, body) {
      const path = `b/${id}.json`;
      const res = await putFile(path, body, shas.get(id));
      if (res.status === 409 || res.status === 422) {
        // Someone wrote this bucket first: hand back their version to merge.
        const latest = await getFile(path);
        if (latest) shas.set(id, latest.sha);
        throw Object.assign(new Error('conflict'), { code: 'conflict', latest: latest && latest.body });
      }
      if (!res.ok) throw httpError(res);
      const j = await res.json();
      shas.set(id, j.content.sha);
    },
  };
  return remote;
}

function claudeRemote(db, uid) {
  const base = `data/users/${uid}`;
  const metaRef = db.doc(`${base}/meta`);
  const buckets = db.doc(`${base}/vault`).collection('b');
  return {
    kind: 'claude',

    async ensureVault(kid) {
      const snap = await metaRef.get();
      const data = snap.exists ? snap.data() : null;
      if (data && data.kid) return data.kid === kid ? 'ok' : 'mismatch';
      await metaRef.set({ v: 1, kid });
      return 'created';
    },

    subscribe(onChanges, onError) {
      return buckets.onSnapshot((snap) => {
        const changes = snap
          .docChanges()
          .filter((c) => c.type !== 'removed')
          .map((c) => ({ id: c.doc.id, body: c.doc.data() }));
        if (changes.length) onChanges(changes);
      }, onError);
    },

    refresh() {},

    write(id, body) {
      return buckets.doc(id).set(body);
    },
  };
}

const STRINGS = { ar: AR, en: EN };

function translator(lang) {
  const dict = STRINGS[lang] || AR;
  const rules = new Intl.PluralRules(lang === 'ar' ? 'ar' : 'en');
  return function t(key, vars) {
    let s = dict[key];
    if (s == null) s = EN[key] != null ? EN[key] : key;
    if (typeof s === 'object') {
      const n = vars && vars.n;
      s = s[rules.select(n)] || s.other;
    }
    if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] != null ? String(vars[k]) : ''));
    return s;
  };
}

// ---- grid.js ----
// Day sheet: pure layout for the hour-by-hour page (day/), drawn like a paper
// time box: one row per hour, a cell for :00 and one for :30. Minutes are
// counted from midnight of the shown day; nothing here touches the DOM.


const DAY_MIN = 24 * 60;
const PRIORITY = '★';

// Sleep hours fold into one row. from/to are "HH:MM"; the range may wrap past
// midnight (23:00 → 06:00). Returns the visible and folded stretches of the
// day in order, each { from, to, sleep }.
function segments(sleep) {
  if (!sleep || !sleep.from || !sleep.to || sleep.from === sleep.to) return [{ from: 0, to: DAY_MIN, sleep: false }];
  const a = toMinutes(sleep.from);
  const b = toMinutes(sleep.to);
  const hidden = a < b ? [[a, b]] : [[0, b], [a, DAY_MIN]].filter(([x, y]) => y > x);
  const out = [];
  let at = 0;
  for (const [x, y] of hidden) {
    if (x > at) out.push({ from: at, to: x, sleep: false });
    out.push({ from: x, to: y, sleep: true });
    at = y;
  }
  if (at < DAY_MIN) out.push({ from: at, to: DAY_MIN, sleep: false });
  return out;
}

function span(task) {
  const s = toMinutes(task.start);
  const len = task.end ? durationMinutes(task.start, task.end) : 0;
  return [s, Math.min(DAY_MIN, s + Math.max(len, 1))];
}

// Rows of the sheet. A visible hour is { hour, cells: [cell, cell] } where a
// cell is { start, items: [{ task, first }] }: every task that covers that half
// hour, `first` where its title is written. A folded stretch is
// { sleep: true, from, to, count } with the number of tasks starting in it.
function sheetRows(tasks, sleep) {
  const spans = tasks.map((task) => ({ task, span: span(task) }));
  const rows = [];
  for (const sg of segments(sleep)) {
    if (sg.sleep) {
      const count = spans.filter(({ span: [a] }) => a >= sg.from && a < sg.to).length;
      rows.push({ sleep: true, from: sg.from, to: sg.to, count });
      continue;
    }
    for (let m = Math.floor(sg.from / 60) * 60; m < sg.to; m += 60) {
      const cells = [m, m + 30].map((start) => {
        const end = start + 30;
        const items = spans
          .filter(({ span: [a, b] }) => a < end && b > start)
          .map(({ task, span: [a] }) => ({ task, first: a >= start || start === sg.from }));
        return { start, items };
      });
      rows.push({ hour: m / 60, cells });
    }
  }
  return rows;
}

const isPriority = (task) => task.title.startsWith(PRIORITY);
const priorityTitle = (task) => task.title.slice(PRIORITY.length).trim();

function parseSleep(v) {
  const m = /^(\d\d:\d\d)-(\d\d:\d\d)$/.exec(v || '');
  return m ? { from: m[1], to: m[2] } : null;

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, String(v));
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const SVG_NS = 'http://www.w3.org/2000/svg';

}

// ---------------------------------------------------------------------------
// Day list

function overlapsFor(scheduled) {
  const span = (x) => {
    const s = toMinutes(x.start);
    const d = x.end ? durationMinutes(x.start, x.end) : 1;
    return [s, s + d];
  };
  const map = new Map();
  for (let i = 0; i < scheduled.length; i++) {
    for (let j = i + 1; j < scheduled.length; j++) {
      const [a1, a2] = span(scheduled[i]);
      const [b1, b2] = span(scheduled[j]);
      if (a1 < b2 && b1 < a2) {
        for (const [p, q] of [
          [scheduled[i], scheduled[j]],
          [scheduled[j], scheduled[i]],
        ]) {
          if (!map.has(p.id)) map.set(p.id, []);
          map.get(p.id).push(q.title);
        }
      }
    }
  }
  return map;
}

// --- Repeating tasks: occurrences appear on matching days without being stored.

function virtualOccurrence(s, date) {
  return { id: occurrenceId(s.id, date), virtual: true, of: s.id, title: s.title, notes: s.notes, date, start: s.start, end: s.end, done: false, created: s.created, conflicts: [] };
}

function seriesOf(task) {
  return task && task.of && engine ? engine.series().find((x) => x.id === task.of) || null : null;
}

function findTask(id) {
  if (!engine) return null;
  if (engine.exists(id)) return engine.get(id);
  const occ = parseOccurrenceId(id);
  if (!occ) return null;
  const s = engine.series().find((x) => x.id === occ.series);
  return s && occursOn(s, occ.date) ? virtualOccurrence(s, occ.date) : null;
}

// Stores an occurrence the first time it is changed.
function realId(id) {
  if (!engine.exists(id)) {
    const occ = parseOccurrenceId(id);
    if (occ) engine.materialize(occ.series, occ.date);
  }
  return id;
}

function updateTask(id, patch) {
  engine.update(realId(id), patch);
}

function dayTasks(key) {
  const list = engine ? engine.tasks().filter((x) => x.date === key) : [];
  if (engine) {
    for (const s of engine.series()) {
      if (occursOn(s, key) && !engine.exists(occurrenceId(s.id, key))) list.push(virtualOccurrence(s, key));
    }
  }
  const scheduled = list.filter((x) => x.start).sort((a, b) => a.start.localeCompare(b.start) || a.created - b.created);
  const anytime = list.filter((x) => !x.start).sort((a, b) => a.created - b.created);
  return { scheduled, anytime };
}

function carryTasks() {
  if (!engine) return [];
  const today = todayKey();
  return engine
    .tasks()
    .filter((x) => !x.done && !x.of && x.date < today && diffDays(x.date, today) <= 14)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.start || '').localeCompare(b.start || ''));
}

function taskRow(task, info = {}) {

  if (info.overlap) meta.push(h('span', { class: 'tag' }, t('overlaps')));
  if (task.conflicts.length) meta.push(h('span', { class: 'tag' }, t('twoVersions')));
  if (task.notes) meta.push(h('span', { class: 'note-preview', dir: 'auto' }, task.notes.split('\n')[0]));
  return h(
    'li',

    h(
      'button',

        onclick: () => updateTask(task.id, { done: !task.done }),

    ),
    h(

      { type: 'button', class: 'task-body', onclick: () => openSheet('task', { id: task.id }) },
      h(

        meta.length ? h('span', { class: 'task-meta' }, meta) : null,

        ? h('span', { class: 'task-time' }, timeEl(task.start, 'start'), task.end ? timeEl(task.end, 'end') : null)
        : null,

function renderList() {
  const { scheduled, anytime } = dayTasks(ui.day);
  const today = todayKey();
  const isToday = ui.day === today;
  const out = [];

  if (isToday) {
    const carry = carryTasks();
    if (carry.length) {
      out.push(
        h(
          'button',

          h('span', null, t('carryRow', { n: carry.length })),

    $('list').replaceChildren(...out);
    return;

  if (scheduled.length) {
    const overlaps = overlapsFor(scheduled);
    const now = toMinutes(nowTime());
    const items = [];
    let nowPlaced = !isToday;
    for (const task of scheduled) {
      const s = toMinutes(task.start);
      const e = task.end ? s + durationMinutes(task.start, task.end) : s;
      const current = isToday && s <= now && now < e;
      if (!nowPlaced && s > now) {
        items.push(nowLine());
        nowPlaced = true;

      items.push(taskRow(task, { overlap: overlaps.has(task.id), current }));

    if (!nowPlaced) items.push(nowLine());
    out.push(h('ul', { class: 'tasks', 'aria-label': t('timeLabel') }, items));
  }

  if (anytime.length) {
    if (scheduled.length) out.push(h('h2', { class: 'section-label' }, t('noTime')));
    out.push(h('ul', { class: 'tasks', 'aria-label': t('noTime') }, anytime.map((x) => taskRow(x))));

  $('list').replaceChildren(...out);

  if (ui.lastAdded) {

    if (row) row.scrollIntoView({ block: 'nearest' });

// --- Zoom: the page opens fitted to the width; pinch (or ctrl + wheel) to
// zoom in and out around the fingers, as in a PDF reader.

const zoom = { z: 0, fit: 1 };
const PAPER_PX = (210 / 25.4) * 96;
const zoomed = () => zoom.z > zoom.fit * 1.05;

function applyZoom() {
  const paper = $('paper');
  if (!paper) return;
  const main = $('main');
  zoom.fit = Math.min(1.5, (main.clientWidth - 16) / PAPER_PX);
  if (!zoom.z || zoom.z < zoom.fit) zoom.z = zoom.fit;
  paper.style.zoom = String(zoom.z);
}

function zoomTo(z, cx, cy) {
  const main = $('main');
  const r = main.getBoundingClientRect();
  const x = cx - r.left;
  const y = cy - r.top;
  const old = zoom.z;
  zoom.z = Math.min(zoom.fit * 5, Math.max(zoom.fit, z));
  $('paper').style.zoom = String(zoom.z);
  const k = zoom.z / old;
  main.scrollLeft = (main.scrollLeft + x) * k - x;
  main.scrollTop = (main.scrollTop + y) * k - y;
}

function setupZoom() {
  const main = $('main');
  let pinch = null;
  const dist = (e) => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  const mid = (e) => [(e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2];
  main.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) pinch = { d: dist(e), z: zoom.z };
  }, { passive: true });
  main.addEventListener('touchmove', (e) => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    zoomTo(pinch.z * (dist(e) / pinch.d), ...mid(e));
  }, { passive: false });
  main.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) pinch = null;
  });
  // Safari's own page zoom would scale the whole app: keep it on the page.
  for (const type of ['gesturestart', 'gesturechange']) main.addEventListener(type, (e) => e.preventDefault());
  main.addEventListener('wheel', (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    zoomTo(zoom.z * Math.exp(-e.deltaY / 200), e.clientX, e.clientY);
  }, { passive: false });
  window.addEventListener('resize', () => {
    const wasFit = !zoomed();
    applyZoom();
    if (wasFit) zoomTo(zoom.fit, 0, 0);
  });
}

function setupGridEvents() {
  setupZoom();
  runTimer();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') runTimer();
  });
  // Keep the "until" choices ahead of the clock.
  setInterval(() => {
    if (!timer.end && !(document.activeElement && document.activeElement.tagName === 'SELECT')) renderTimer();
  }, 60000);
  $('printBtn').addEventListener('click', () => window.print());
}

// --- Timer: counts down on the page; the screen stays on while it runs.
// Safari does not ring a web timer on a locked phone, so it is only shown
// while the page is open.

const timer = { end: Number(prefs.get('timerEnd')) || 0, iv: null, lock: null, audio: null };

function startTimer(ms) {
  timer.end = Date.now() + ms;
  prefs.set('timerEnd', String(timer.end));
  // Unlock audio inside the tap so the bell can play later.
  try {
    timer.audio = timer.audio || new (window.AudioContext || window.webkitAudioContext)();
    timer.audio.resume();
  } catch (_) {}
  runTimer();
}

function stopTimer() {
  timer.end = 0;
  prefs.set('timerEnd', '');
  runTimer();
}

async function keepAwake(on) {
  try {
    if (on && !timer.lock && navigator.wakeLock && document.visibilityState === 'visible') {
      timer.lock = await navigator.wakeLock.request('screen');
      timer.lock.addEventListener('release', () => (timer.lock = null));
    } else if (!on && timer.lock) {
      await timer.lock.release();
      timer.lock = null;
    }
  } catch (_) {}
}

function bell() {
  const ac = timer.audio;
  if (!ac) return;
  try {
    for (let i = 0; i < 3; i++) {
      const o = ac.createOscillator();
      const g = ac.createGain();
      const at = ac.currentTime + i * 0.6;
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.3, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.5);
      o.connect(g).connect(ac.destination);
      o.start(at);
      o.stop(at + 0.5);
    }
  } catch (_) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function countdownText(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const pad = (n) => String(n).padStart(2, '0');
  const hr = Math.floor(s / 3600);
  return `${hr ? hr + ':' : ''}${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
}

function runTimer() {
  clearInterval(timer.iv);
  timer.iv = null;
  const left = timer.end - Date.now();
  if (timer.end && left > 0) {
    timer.iv = setInterval(() => {
      const ms = timer.end - Date.now();
      const el = $('timerLeft');
      if (ms <= 0) {
        bell();
        toast(t('timerDone'));
        stopTimer();
      } else if (el) el.textContent = countdownText(ms);
    }, 1000);
    keepAwake(true);
  } else {
    if (timer.end) {
      timer.end = 0;
      prefs.set('timerEnd', '');
    }
    keepAwake(false);
  }
  renderTimer();
}

// Choices for "until": every half hour for the next twelve hours.
function untilChoices() {
  const now = toMinutes(nowTime());
  const first = Math.floor(now / 30) * 30 + 30;
  return Array.from({ length: 24 }, (_, i) => fromMinutes(first + i * 30));
}

function untilMs(time) {
  const d = new Date();
  const [hr, mn] = time.split(':').map(Number);
  const at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hr, mn, 0, 0);
  if (at <= d) at.setDate(at.getDate() + 1);
  return at - d;
}
